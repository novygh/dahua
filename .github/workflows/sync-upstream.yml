name: Sync upstream and preserve VTO patch

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/rroller/dahua.git 2>/dev/null || true
          git fetch upstream main

      - name: Merge upstream
        run: |
          # The fork intentionally carries a tiny VTO-only change in camera.py.
          # Upstream also edits this area, so let upstream win conflicting hunks;
          # the VTO patch is reapplied in the next step.
          git merge upstream/main --no-edit -X theirs

      - name: Ensure VTO backchannel patch is present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("custom_components/dahua/camera.py")
          text = path.read_text()

          if "#backchannel=0" not in text:
              # Match the RTSP stream-source assignment even if upstream reformats
              # the get_rtsp_stream_url() call across multiple lines.
              pattern = re.compile(
                  r'(?m)^        self\._stream_source = '
                  r'coordinator\.client\.get_rtsp_stream_url\(.*?^        \)\n',
                  re.DOTALL,
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit(
                      "RTSP stream-source assignment changed upstream; refusing to patch automatically"
                  )

              patched_block = (
                  match.group(0)
                  + "        if coordinator.is_doorbell():\n"
                  + "            self._stream_source += \"#backchannel=0\"\n"
              )
              text = text[:match.start()] + patched_block + text[match.end():]
              path.write_text(text)
          PY

      - name: Verify only known fork differences remain
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = ".github/workflows/sync-upstream.yml"
          camera = "custom_components/dahua/camera.py"
          allowed = {workflow, camera}

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "upstream/main", "--"],
                  text=True,
              ).splitlines()
          )

          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(
                  "Unexpected fork differences after upstream merge: "
                  + ", ".join(sorted(unexpected))
              )

          if camera not in changed:
              raise SystemExit(
                  "VTO patch is no longer a fork-only difference; refusing automatic push"
              )

          patch = (
              '        if coordinator.is_doorbell():\n'
              '            self._stream_source += "#backchannel=0"\n'
          )
          legacy_comment = (
              '        # "async_set_infrared_mode" is the method called upon calling '
              'the service. Defined below in the DahuaCamera class\n'
          )
          upstream_comment = (
              '        # "async_set_infrared_mode" is the method called upon calling '
              'the service. Defined below in DahuaCamera class\n'
          )

          local = Path(camera).read_text()
          if local.count(patch) != 1:
              raise SystemExit(
                  "Expected exactly one VTO backchannel patch in camera.py"
              )

          upstream = subprocess.check_output(
              ["git", "show", f"upstream/main:{camera}"],
              text=True,
          )

          normalized = local.replace(patch, "", 1)

          # One harmless comment edit predates the automated sync. Permit only
          # that exact historical delta, and only while upstream still has the
          # original wording. Any other camera.py change stops the workflow.
          if legacy_comment in normalized and upstream_comment in upstream:
              if normalized.count(legacy_comment) != 1:
                  raise SystemExit("Unexpected duplicate legacy comment delta")
              normalized = normalized.replace(legacy_comment, upstream_comment, 1)

          if normalized != upstream:
              raise SystemExit(
                  "camera.py differs from upstream by more than the known VTO patch/comment delta"
              )

          print("OK: only the known, explicitly validated fork differences remain")
          PY

      - name: Sanity-check Python sources
        run: |
          git diff --check upstream/main --
          python -m compileall -q custom_components/dahua

      - name: Commit preserved patch if needed
        run: |
          git add custom_components/dahua/camera.py
          if ! git diff --cached --quiet; then
            git commit -m "Preserve VTO backchannel patch after upstream sync"
          fi

      - name: Final guard before push
        run: |
          test "$(git grep -F '#backchannel=0' -- custom_components/dahua/camera.py | wc -l)" -eq 1
          git diff --quiet

      - name: Push fork
        run: |
          git push origin main
